<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Konsil 3D Scene</title>
<style>
html,body{margin:0;height:100%;background:#0e0e10;color:#ddd;font:14px -apple-system,"Segoe UI",sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
#bar{padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #2a2a2e}
#bar b{color:#fff}
select,button{background:#1c1c21;color:#ddd;border:1px solid #3a3a40;border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
button.active{background:#2e5cff;border-color:#2e5cff;color:#fff}
.ctl{display:flex;align-items:center;gap:6px;font-size:12px;color:#aaa}
#main{display:flex;flex:1;min-height:0}
#side{width:265px;min-width:265px;overflow-y:auto;border-right:1px solid #2a2a2e;padding:6px 0}
#sideHead{display:flex;gap:6px;padding:2px 10px 8px}
#sideHead button{font-size:11px;padding:3px 8px}
details{margin:0 0 2px}
summary{cursor:pointer;padding:5px 12px;font-size:12px;color:#9a9aa2;user-select:none}
summary:hover{color:#fff}
.row{display:flex;align-items:center;gap:6px;padding:3px 8px 3px 20px;font-size:12px;cursor:pointer}
.row:hover{background:#1a1a1f}
.row.err{opacity:.45;text-decoration:line-through}
.row.focused{background:#1d2740}
.row input{margin:0}
.sw{display:inline-block;width:10px;min-width:10px;height:10px;border-radius:2px}
.nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{color:#77777f}
.rowbtn{border:none;background:none;color:#6a7a9a;padding:0 3px;font-size:13px}
.rowbtn:hover{color:#fff}
.rowbtn.on{color:#4e7bff}
.annbadge{border:none;background:none;color:#c9a44a;padding:0 2px;font-size:12px;cursor:pointer}
#annBox{border-top:1px solid #2a2a2e;margin-top:6px;padding:8px 12px;font-size:12px}
#annBox h4{margin:0 0 6px;font-size:12px;color:#c9a44a}
#annBox .ann{margin:0 0 8px;color:#c8c8cf}
#annBox .ann small{display:block;color:#77777f;margin-top:2px}
#annNone summary{color:#9a9aa2}
#annNone .ann{padding:3px 12px 3px 20px;font-size:12px;color:#a8a8af}
#annNone .ann small{display:block;color:#77777f}
#gl{flex:1;min-width:0}
#foot{display:flex;justify-content:space-between;gap:14px;padding:6px 14px;font-size:12px;color:#8a8a92;border-top:1px solid #2a2a2e}
#status{color:#c9a44a;white-space:nowrap}
#status.err{color:#e06060}
</style></head>
<body>
<div id="bar">
  <b id="title">Konsil</b>
  <select id="series" hidden></select>
  <button id="mRender" class="active">3D Render</button>
  <button id="mMPR">Kesitler (MPR)</button>
  <span class="ctl">Görüntü opaklığı <input id="op" type="range" min="0" max="1" step="0.01" value="1"></span>
  <span class="ctl">Yakınlaştır <input id="zoom" type="range" min="0.5" max="2" step="0.05" value="1"></span>
  <span class="ctl" id="clipWrap">Clip <input id="clip" type="range" min="0" max="1" step="0.01" value="1"></span>
  <button id="btnReset" title="Varsayılan görünüme dön">Sıfırla</button>
</div>
<div id="main">
  <aside id="side">
    <div id="sideHead">
      <button id="allOn">Tümü</button><button id="allOff">Hiçbiri</button><button id="allDef">Varsayılan</button>
    </div>
    <div id="groups"></div>
    <div id="annBox" hidden>
      <h4 id="annTitle">Rapor bulguları</h4>
      <div id="annList"></div>
    </div>
    <details id="annNone" hidden>
      <summary></summary>
      <div id="annNoneList"></div>
    </details>
  </aside>
  <canvas id="gl"></canvas>
</div>
<div id="foot">
  <span>Communication aid only — yorum, radyoloğun yazılı raporuna aittir. Sürükle=döndür · Scroll=yakınlaştır/kesit · Sağ-sürükle=kontrast · ◐=solo · ⌖=kesitlerde odakla</span>
  <span id="status"></span>
</div>
<script type="module">
const $ = id => document.getElementById(id);
const statusEl = $("status");
const setStatus = (msg, err) => { statusEl.textContent = msg || ""; statusEl.classList.toggle("err", !!err); };
// state mirrored into DOM data-attributes (QA/debug: visible from any JS world)
const mark = (k, v) => { document.body.dataset[k] = String(v); };
// NiiVue mesh buffer'ları asenkron güncellenir; updateGLVolume sonrası tetiklenmiş bir
// yeniden çizim olmazsa sahne eski karede kalır — kısa gecikmeli çift drawScene şart
let redrawT = null;
function redraw() {
  if (!nv) return;
  nv.drawScene();
  clearTimeout(redrawT);
  redrawT = setTimeout(() => { try { nv.drawScene(); syncZoomSlider(); } catch (_) {} }, 400);
}
const withTimeout = (p, ms, what) => Promise.race([p,
  new Promise((_, rej) => setTimeout(() => rej(new Error(what + ": zaman aşımı")), ms))]);

// --- state ---
let nv = null, scene = null, mode = "render", soloName = null, focusedName = null, overlayVol = null;
let focusSeq = 0;  // odak akışları için nesil sayacı — örtüşen ⌖ tıkları birbirini iptal eder
const rows = {};   // name -> {row, cb, solo, s}
let annByName = {}; // structure name -> [{source, text}] (annotations.json; yoksa boş)
let annNote = "";   // annotations.json üst-düzey provenance/disclaimer notu
const setVolOpacity = v => { if (nv && nv.volumes.length) nv.setOpacity(0, v); };
// zoom: 3D render'da volScaleMultiplier, MPR kesitlerinde pan2Dxyzmm — her modda tutarlı.
// Aralık [0.5, 2]: NiiVue'nun kendi tekerlek zoom'u da bu aralığa kırpar, kaydıraçla çelişmesin.
// MPR'da pan telafisi ŞART (NiiVue'nun kendi zoom yolu gibi): yoksa pencere crosshair'den kayar.
function setZoom(z) {
  if (!nv) return;
  z = Math.min(2, Math.max(0.5, z));
  nv.scene.volScaleMultiplier = z;
  const p = nv.scene.pan2Dxyzmm;
  const old = p[3] || 1;
  let mm = [0, 0, 0];
  try { mm = nv.frac2mm(nv.scene.crosshairPos); } catch (_) {}
  nv.scene.pan2Dxyzmm = [p[0] + (old - z) * mm[0], p[1] + (old - z) * mm[1], p[2] + (old - z) * mm[2], z];
  mark("zoom", z);
  redraw();
}
// tekerlekle yapılan render zoom'u kaydıraca geri yansıt (tek yönlü kopukluk olmasın)
function syncZoomSlider() {
  if (!nv) return;
  const v = nv.scene.volScaleMultiplier;
  if (Math.abs(parseFloat($("zoom").value) - v) > 0.01) $("zoom").value = v;
}

// --- rapor işaretçileri: yazılı raporun tarif ettiği BÖLGE, yapının kendi maskesinin
// üst/orta/alt üçte-birlik geometrisiyle işaretlenir (salt geometri — piksel yorumu değil,
// lezyonun kesin yeri değil; etiketler ≈ ile yaklaşıklığı söyler) ---
function regionAnchor(mesh, region) {
  const p = mesh.pts;
  let zmin = Infinity, zmax = -Infinity;
  for (let i = 2; i < p.length; i += 3) { if (p[i] < zmin) zmin = p[i]; if (p[i] > zmax) zmax = p[i]; }
  let lo = zmin, hi = zmax; // scanner uzayında +Z = superior (üst)
  if (region === "upper") lo = zmin + (zmax - zmin) * 2 / 3;
  else if (region === "lower") hi = zmin + (zmax - zmin) / 3;
  else if (region === "mid") { lo = zmin + (zmax - zmin) / 3; hi = zmin + (zmax - zmin) * 2 / 3; }
  let x = 0, y = 0, z = 0, n = 0;
  for (let i = 0; i < p.length; i += 3) { const zz = p[i + 2]; if (zz >= lo && zz <= hi) { x += p[i]; y += p[i + 1]; z += zz; n++; } }
  return n ? [x / n, y / n, z / n] : null;
}

function clearMarkers() {
  try { if (nv?.document?.labels?.length) { nv.document.labels.length = 0; mark("labels", 0); } } catch (_) {}
}

// NiiVue etiket fontu YALNIZCA ASCII 32-126 glif içeriyor; eksik glif SESSİZCE düşer —
// "40×31" -> "4031", "94 cm³" -> "94 cm" (birim değişir!). Her non-ASCII karakteri güvenle indir:
// önce açık harita, sonra NFKD ayrıştırması (³->3, ğ->g), en son görünür "?" (sessiz kayıp yerine).
const LABEL_CH = { "≈": "~", "×": "x", "—": "-", "–": "-", "“": '"', "”": '"', "’": "'",
  "ı": "i", "İ": "I", "µ": "u", "°": " deg" };
const asciiLabel = t => [...t].map(c => {
  if (c.charCodeAt(0) <= 126) return c;
  if (LABEL_CH[c] !== undefined) return LABEL_CH[c];
  const d = c.normalize("NFKD").replace(/\p{M}/gu, "");
  return (d && [...d].every(x => x.charCodeAt(0) <= 126)) ? d : "?";
}).join("");

const REGIONS = ["upper", "mid", "lower", "center"];
function addMarkers(s) {
  clearMarkers();
  // aynı bölgedeki işaretçileri TEK etikette birleştir: uzamsal ofset anatomik yön uydurur, yapma
  const byRegion = {};
  (annByName[s.name] || []).filter(a => a.marker).forEach(a => {
    let reg = a.marker.region || "center";
    if (!REGIONS.includes(reg)) { console.warn(`bilinmeyen marker bölgesi "${reg}" — center varsayıldı`); reg = "center"; }
    (byRegion[reg] ??= []).push(a.marker.label || a.text.slice(0, 40));
  });
  let anchor = null;
  for (const [reg, texts] of Object.entries(byRegion)) {
    const pt = regionAnchor(s._mesh, reg);
    if (!pt) continue;
    if (!anchor) anchor = pt;
    try {
      nv.addLabel(asciiLabel("~ " + texts.join("  |  ")),
        { textColor: [1, 0.85, 0.4, 1], textScale: 0.9, bulletScale: 0.3,
          bulletColor: [1, 0.35, 0.2, 1], lineWidth: 2, lineColor: [1, 0.45, 0.3, 0.9] },
        pt);
      mark("labels", nv.document.labels.length);
    } catch (e) { console.warn("label eklenemedi", e); }
  }
  return anchor; // varsa crosshair bu bölgeye gitsin (tüm-organ merkezinden daha isabetli)
}

// --- annotations: yazılı rapor alıntıları, yapı adına eşlenmiş (asla piksel yorumu değil) ---
function showAnnotations(s) {
  const list = annByName[s.name] || [];
  const box = $("annBox");
  if (!list.length) { box.hidden = true; return; }
  $("annTitle").textContent = `Rapor bulguları — ${s.label}`;
  const el = $("annList"); el.innerHTML = "";
  list.forEach(a => {
    const d = document.createElement("div"); d.className = "ann";
    d.textContent = `“${a.text}”`;
    if (a.source) { const sm = document.createElement("small"); sm.textContent = a.source; d.appendChild(sm); }
    el.appendChild(d);
  });
  if (annNote) { const n = document.createElement("div"); n.className = "ann"; const sm = document.createElement("small"); sm.textContent = annNote; n.appendChild(sm); el.appendChild(n); }
  box.hidden = false;
}

function buildNotLocalizable(items) {
  if (!items || !items.length) return;
  const det = $("annNone");
  det.querySelector("summary").textContent = `Sahneye yerleştirilemeyen rapor bulguları (${items.length})`;
  const el = $("annNoneList"); el.innerHTML = "";
  if (annNote) { const n = document.createElement("div"); n.className = "ann"; const sm = document.createElement("small"); sm.textContent = annNote; n.appendChild(sm); el.appendChild(n); }
  items.forEach(a => {
    const d = document.createElement("div"); d.className = "ann";
    d.textContent = `“${a.text}”`;
    if (a.source) { const sm = document.createElement("small"); sm.textContent = a.source; d.appendChild(sm); }
    el.appendChild(d);
  });
  det.hidden = false;
}

// --- UI handlers: bound BEFORE any network load so the bar never goes dead ---
$("mRender").onclick = () => setMode("render");
$("mMPR").onclick = () => setMode("mpr");
$("op").oninput = e => { const v = parseFloat(e.target.value); if (mode === "render") renderOpacity = v; setVolOpacity(v); };
$("clip").oninput = e => { if (nv) nv.setClipPlane([parseFloat(e.target.value) * 2 - 1, 0, 120]); };
$("zoom").oninput = e => setZoom(parseFloat(e.target.value));
$("gl").addEventListener("wheel", () => setTimeout(syncZoomSlider, 150), { passive: true });
$("series").onchange = e => loadSeries(e.target.value).catch(err => setStatus(err.message, true));
$("allOn").onclick = () => setAll(s => true);
$("allOff").onclick = () => setAll(s => false);
$("allDef").onclick = () => setAll(s => !!s.on);
$("btnReset").onclick = async () => {
  soloName = null;
  Object.values(rows).forEach(r => r.solo.classList.remove("on"));
  await clearFocus();
  setAll(s => !!s.on);
  renderOpacity = scene ? (scene.volume_opacity ?? 1) : 1;
  $("op").value = renderOpacity;
  setVolOpacity(renderOpacity);
  $("clip").value = 1;
  if (nv) nv.setClipPlane([1, 0, 120]);
  $("zoom").value = 1;
  setZoom(1);
  setStatus("");
  setMode("render");
};

let renderOpacity = null; // render modundaki opaklık; MPR'a geçerken saklanır, dönüşte geri yüklenir
function setMode(m) {
  const prev = mode;
  mode = m;
  $("mRender").classList.toggle("active", m === "render");
  $("mMPR").classList.toggle("active", m !== "render");
  mark("mode", m);
  if (!nv) return; // init sonunda setMode(mode) yeniden çağrılır — erken tıklar kaybolmaz
  if (m === "render") {
    clearFocus();
    if (prev !== "render" && renderOpacity !== null) { $("op").value = renderOpacity; setVolOpacity(renderOpacity); }
    nv.setSliceType(nv.sliceTypeRender);
  } else {
    if (prev === "render") renderOpacity = parseFloat($("op").value);
    nv.setSliceType(nv.sliceTypeMultiplanar);
    if (parseFloat($("op").value) < 0.05) { $("op").value = 1; setVolOpacity(1); }
  }
  redraw();
}

// --- structure visibility ---
async function ensureMesh(s) {
  if (s._mesh || s._err) return;
  if (s._loading) return s._loading;
  s._loading = (async () => {
    try {
      setStatus(`Yükleniyor: ${s.label}…`);
      // NOT: addMeshFromUrl'e uzantısız "name" verilirse NiiVue format çözümü patlar — name'i URL'den türetmesine izin ver
      const p = nv.addMeshFromUrl({ url: s.mesh, rgba255: s.rgba });
      // Zaman aşımı yüklemeyi İPTAL EDEMEZ (NiiVue mesh'i kendisi ekler) — geç gelse bile
      // sahiplen ki checkbox/solo onu kontrol edebilsin; hayalet mesh kalmasın
      p.then(m => {
        s._mesh = m; s._err = false;
        rows[s.name].row.classList.remove("err"); rows[s.name].row.title = "";
        mark("meshCount", nv.meshes.length);
        applyVisible(s);
      }).catch(() => {});
      await withTimeout(p, 60000, s.label);
      setStatus("");
    } catch (e) {
      if (!s._mesh) {
        s._err = true;
        rows[s.name].row.classList.add("err");
        rows[s.name].row.title = `${s.label} yüklenemedi (${e.message}) — tekrar denemek için kutuyu yeniden işaretleyin`;
        setStatus(`${s.label} yüklenemedi (${e.message})`, true);
      }
    } finally { s._loading = null; }
  })();
  return s._loading;
}

function applyVisible(s) {
  if (!s._mesh) return;
  const vis = s._on && (!soloName || soloName === s.name);
  nv.setMeshProperty(s._mesh.id, "visible", vis);
  redraw();
}

async function setStructure(s, on) {
  s._on = on;
  rows[s.name].cb.checked = on;
  if (on) {
    // hata kalıcı değildir: kullanıcı kutuyu yeniden işaretlerse tekrar dene
    if (s._err && !s._loading) { s._err = false; rows[s.name].row.classList.remove("err"); }
    await ensureMesh(s);
  }
  applyVisible(s);
}

function setAll(pred) {
  if (!scene) return;
  soloName = null;
  scene.structures.forEach(s => setStructure(s, pred(s)));
}

function toggleSolo(s) {
  if (soloName !== s.name && s._err) { setStatus(`${s.label} yüklenemedi — solo yapılamıyor`, true); return; }
  soloName = (soloName === s.name) ? null : s.name;
  Object.values(rows).forEach(r => r.solo.classList.toggle("on", soloName === r.s.name));
  if (soloName) setStructure(s, true);
  scene.structures.forEach(applyVisible);
  setStatus(soloName ? `Solo: ${s.label}` : "");
}

// --- per-organ slice focus: crosshair to centroid + mask overlay on MPR ---
async function clearFocus() {
  focusSeq++; // bekleyen odak akışlarını iptal et
  if (focusedName) setStatus("");
  if (focusedName && rows[focusedName]) rows[focusedName].row.classList.remove("focused");
  focusedName = null;
  mark("focused", ""); mark("overlay", false);
  $("annBox").hidden = true;
  clearMarkers();
  overlayVol = null;
  // handle'ı kaybolmuş (öksüz) maskeler dahil: ana görüntü dışındaki tüm volumeleri kaldır
  if (nv) { while (nv.volumes.length > 1) { try { nv.removeVolume(nv.volumes[nv.volumes.length - 1]); } catch (_) { break; } } }
}

async function focusStructure(s) {
  if (focusedName === s.name) { await clearFocus(); redraw(); return; }
  await clearFocus();
  const seq = focusSeq; // clearFocus arttırdı; bu akış bu nesle ait
  await setStructure(s, true);
  if (seq !== focusSeq) return; // arada başka odak/temizlik oldu
  if (s._err || !s._mesh) { setStatus(`${s.label} yüklenemedi — odaklanamıyor`, true); return; }
  setMode("mpr");
  // rapor işaretçisi varsa crosshair o bölgeye; yoksa tüm-organ merkezine
  try {
    let target = addMarkers(s);
    if (!target) {
      const p = s._mesh.pts; let x = 0, y = 0, z = 0; const n = p.length / 3;
      for (let i = 0; i < p.length; i += 3) { x += p[i]; y += p[i + 1]; z += p[i + 2]; }
      target = [x / n, y / n, z / n];
    }
    nv.scene.crosshairPos = nv.mm2frac(target);
    // pan'ı yeni crosshair'e göre yeniden kur (pan = (1−zoom)·mm, NiiVue'nun kendi zoom formu):
    // önceki odaktan birikmiş pan pencereyi kaydırıp yeni odağı ekran dışında bırakabilir
    const pz = nv.scene.pan2Dxyzmm[3] || 1;
    nv.scene.pan2Dxyzmm = [(1 - pz) * target[0], (1 - pz) * target[1], (1 - pz) * target[2], pz];
  } catch (e) { console.warn("crosshair focus failed", e); }
  const hasMarker = (annByName[s.name] || []).some(a => a.marker);
  const focusMsg = `Odak: ${s.label} — scroll ile kesitlerde gezin${hasMarker ? " · işaret YAKLAŞIK bölgedir, lezyonun kesin yeri değil" : ""}`;
  if (s.seg) {
    setStatus(`Maske yükleniyor: ${s.label}…`);
    // await ETME: geç çözülen maske bayatsa hemen kaldırılır — öksüz overlay kalmaz
    nv.addVolumeFromUrl({ url: s.seg, colormap: "red", opacity: 0.45 }).then(v => {
      if (seq !== focusSeq) { try { nv.removeVolume(v); } catch (_) {} return; }
      overlayVol = v;
      mark("overlay", true);
      setStatus(focusMsg);
      redraw();
    }).catch(() => { if (seq === focusSeq) setStatus(`Maske yüklenemedi: ${s.label}`, true); });
  }
  focusedName = s.name;
  rows[s.name].row.classList.add("focused");
  showAnnotations(s);
  mark("focused", s.name);
  nv.updateGLVolume();
  redraw();
  setStatus(focusMsg);
}

// --- sidebar ---
function buildSidebar() {
  const order = ["Organlar", "Solunum", "Damarlar", "Kemik", "Kas", "Diğer"];
  const byGroup = {};
  scene.structures.forEach(s => { s._on = !!s.on; (byGroup[s.group ?? "Diğer"] ??= []).push(s); });
  const box = $("groups");
  order.concat(Object.keys(byGroup).filter(g => !order.includes(g))).forEach(g => {
    const list = byGroup[g]; if (!list) return;
    list.sort((a, b) => a.label.localeCompare(b.label, "tr"));
    const det = document.createElement("details");
    det.open = list.some(s => s.on);
    const sum = document.createElement("summary");
    sum.textContent = `${g} (${list.length})`;
    det.appendChild(sum);
    list.forEach(s => {
      const row = document.createElement("div"); row.className = "row"; row.dataset.name = s.name;
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = !!s.on;
      cb.onchange = () => setStructure(s, cb.checked);
      const sw = document.createElement("span"); sw.className = "sw";
      sw.style.background = `rgb(${s.rgba[0]},${s.rgba[1]},${s.rgba[2]})`;
      // textContent kullan: scene.json alanları HTML olarak yorumlanmasın (XSS)
      const nm = document.createElement("span"); nm.className = "nm";
      nm.textContent = s.label + " ";
      const ml = document.createElement("small"); ml.textContent = `${s.volume_ml} mL`; nm.appendChild(ml);
      nm.title = `${s.name} — ${s.volume_ml} mL`;
      nm.onclick = () => { cb.checked = !cb.checked; setStructure(s, cb.checked); };
      const solo = document.createElement("button"); solo.className = "rowbtn solo-btn"; solo.textContent = "◐";
      solo.title = "Solo — sadece bu yapıyı göster"; solo.onclick = () => toggleSolo(s);
      const foc = document.createElement("button"); foc.className = "rowbtn focus-btn"; foc.textContent = "⌖";
      foc.title = "Kesitlerde odakla — rapor işaretçisi varsa o bölgeye, yoksa organ merkezine gider (yaklaşık)";
      foc.onclick = () => focusStructure(s).catch(e => setStatus(e.message, true));
      row.append(cb, sw, nm, solo, foc);
      if ((annByName[s.name] || []).length) {
        const ab = document.createElement("button"); ab.className = "annbadge"; ab.textContent = "📄";
        ab.title = "Yazılı rapor bulgusu var — göster"; ab.onclick = () => showAnnotations(s);
        row.appendChild(ab);
      }
      det.appendChild(row);
      rows[s.name] = { row, cb, solo, s };
    });
    box.appendChild(det);
  });
}

async function loadSeries(url) {
  await clearFocus();
  setStatus("Seri yükleniyor…");
  try {
    await withTimeout(nv.loadVolumes([{ url, colormap: "gray", opacity: parseFloat($("op").value) }]), 120000, "seri");
    setStatus("");
  } catch (e) { setStatus("Seri yüklenemedi: " + e.message, true); }
  setMode(mode);
}

// --- init ---
async function init() {
  const resp = await fetch("scene.json");
  if (!resp.ok) throw new Error(`scene.json okunamadı (HTTP ${resp.status})`);
  scene = await resp.json();
  document.title = scene.title;
  $("title").textContent = scene.title;
  if ((scene.volumes ?? []).length > 1) {
    const sel = $("series"); sel.hidden = false;
    scene.volumes.forEach(v => { const o = document.createElement("option"); o.value = v.url; o.textContent = v.label; sel.appendChild(o); });
  }
  $("op").value = scene.volume_opacity ?? 1;
  renderOpacity = parseFloat($("op").value);
  // annotations.json isteğe bağlıdır — yoksa arayüz değişmez; bozuksa sessiz kalma
  try {
    const r = await fetch("annotations.json");
    if (r.ok) {
      try {
        const ann = await r.json();
        annNote = ann.note || "";
        (ann.annotations || []).forEach(a => (annByName[a.structure] ??= []).push(a));
        buildNotLocalizable(ann.not_localizable);
      } catch (e) { setStatus("annotations.json bozuk — rapor bulguları gösterilemiyor", true); }
    }
  } catch (_) {}
  buildSidebar();

  // NiiVue yereldir (build_scene_viewer.py kopyalar) — CDN yok, offline çalışır, sürüm sabit (0.69.0)
  const { Niivue } = await import("./niivue.esm.js");
  nv = new Niivue({ backColor: [0.055, 0.055, 0.06, 1], show3Dcrosshair: true });
  nv.attachTo("gl");
  // MPR'da render karosu HEP açık (SHOW_RENDER.ALWAYS = 1, sayısal enum — string atama sessizce
  // NEVER gibi davranır): karo yokken etiket kılavuz çizgileri kanvasın köşesine çizilir
  try { nv.opts.multiplanarShowRender = 1; } catch (_) {}
  window.nv = nv; window.__konsil = { get scene() { return scene; }, get mode() { return mode; }, rows, focusStructure, setMode };

  mark("nv", 1);
  const vol0 = (scene.volumes ?? [])[0];
  let volErr = null;
  if (vol0) {
    setStatus("Görüntü yükleniyor…");
    try {
      await withTimeout(nv.loadVolumes([{ url: vol0.url, colormap: "gray", opacity: parseFloat($("op").value) }]), 120000, "görüntü");
      mark("volume", 1);
    } catch (e) { volErr = e.message; } // hacim inmese de yapılar yüklensin
  }
  const defaults = scene.structures.filter(s => s.on);
  for (let i = 0; i < defaults.length; i++) {
    setStatus(`Yapılar yükleniyor (${i + 1}/${defaults.length}): ${defaults[i].label}…`);
    await ensureMesh(defaults[i]);
    applyVisible(defaults[i]);
  }
  setMode(mode); // init sırasında tıklanmış olabilecek modu şimdi gerçekten uygula
  setZoom(parseFloat($("zoom").value)); // init sırasında oynatılmış kaydıracı da uygula
  nv.updateGLVolume();
  redraw();
  mark("ready", 1);
  setStatus(volErr ? `Görüntü yüklenemedi (${volErr}) — yalnızca yapılar gösteriliyor` : "", !!volErr);
}
init().catch(e => { console.error(e); mark("initError", e.message); setStatus("Sahne yüklenemedi: " + e.message, true); });
</script>
</body></html>
